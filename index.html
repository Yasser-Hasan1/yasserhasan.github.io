<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Name Portfolio</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    h1 {
      margin-top: 50px;
    }

    .webring-container {
      margin-top: 100px;
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
    }

    .webring-logo,
    .left-arrow,
    .right-arrow {
      width: 60px;
      height: 60px;
      background-color: white;
    }

    .webring-logo {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/logo.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/logo.svg");
    }

    .left-arrow {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/leftArrow.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/leftArrow.svg");
    }

    .right-arrow {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/rightArrow.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/rightArrow.svg");
    }

    .webring-logo,
    .left-arrow,
    .right-arrow {
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
  </style>
</head>

<body>

  <h1>Your Name</h1>
  <p>Welcome to my portfolio</p>

  <div class="webring-container">
    <a href="https://mohawk-college-webring.vercel.app/api/previous?from=https://yourusername.github.io">
      <div class="left-arrow"></div>
    </a>

    <a href="https://mohawk-college-webring.vercel.app">
      <div class="webring-logo"></div>
    </a>

    <a href="https://mohawk-college-webring.vercel.app/api/next?from=https://yourusername.github.io">
      <div class="right-arrow"></div>
    </a>
  </div>

</body>
</html>
