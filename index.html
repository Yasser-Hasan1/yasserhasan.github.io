<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yasser Hasan Portfolio</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #0f172a;
      color: white;
    }

    h1 {
      margin-top: 60px;
      font-size: 40px;
    }

    p {
      color: #94a3b8;
    }

    .webring-container {
      margin-top: 120px;
      display: flex;
      justify-content: center;
      gap: 25px;
      align-items: center;
    }

    .webring-logo,
    .left-arrow,
    .right-arrow {
      width: 60px;
      height: 60px;
      background-color: #38bdf8;
      transition: 0.2s;
    }

    .webring-logo:hover,
    .left-arrow:hover,
    .right-arrow:hover {
      transform: scale(1.1);
    }

    .webring-logo {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/logo.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/logo.svg");
    }

    .left-arrow {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/leftArrow.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/leftArrow.svg");
    }

    .right-arrow {
      -webkit-mask-image: url("https://mohawk-college-webring.vercel.app/rightArrow.svg");
      mask-image: url("https://mohawk-college-webring.vercel.app/rightArrow.svg");
    }

    .webring-logo,
    .left-arrow,
    .right-arrow {
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }
  </style>
</head>

<body>

  <h1>Yasser Hasan</h1>
  <p>Software Developer | Mohawk College</p>

  <div class="webring-container">
    <a href="https://mohawk-college-webring.vercel.app/api/previous?from=https://yasser-hasan1.github.io/yasserhasan.github.io/">
      <div class="left-arrow"></div>
    </a>

    <a href="https://mohawk-college-webring.vercel.app">
      <div class="webring-logo"></div>
    </a>

    <a href="https://mohawk-college-webring.vercel.app/api/next?from=https://yasser-hasan1.github.io/yasserhasan.github.io/">
      <div class="right-arrow"></div>
    </a>
  </div>

</body>
</html>
